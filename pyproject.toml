[project]
name = "xtor"
version = "0.4.3"
description = "Manage Tor instances"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.10"
keywords = [
    "tor",
    "torrc",
    "torrc manager",
    "tor manager",
    "tor instance",
    "proxy",
]
authors = [
    { name = "khalidelborai", email = "elboraikhalid@gmail.com" }
]

dependencies = [
    "stem>=1.8.2",
    "httpx[socks]>=0.24.1",
    "where>=1.0.2",
    "typer>=0.9.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.0",
    "lazydocs>=0.4.8",
]

[project.scripts]
xtor = "xtor.cli:main"

[project.urls]
Repository = "https://github.com/khalidelborai/xtor"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
