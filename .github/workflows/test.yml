name: Run Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test_linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.8", "3.9", "3.10"] # Example versions, adjust as needed

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          echo "$HOME/.local/bin" >> $GITHUB_PATH
      
      - name: Install dependencies
        run: |
          poetry install
          # Pytest and typer[all] for testing are not in pyproject.toml dev dependencies yet
          # Install them manually for now. Ideally, add them to pyproject.toml dev group.
          pip install pytest "typer[all]"

      - name: Install system Tor and obfs4proxy (for tests that might need them)
        run: |
          sudo apt-get update
          sudo apt-get install -y tor obfs4proxy
          # Ensure Tor service is not running by default, tests should manage their own instances if needed
          sudo systemctl stop tor || true 
          sudo systemctl disable tor || true

      - name: Run tests
        run: |
          pytest tests/

  test_windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10' # Choose a specific version for Windows

      - name: Install Poetry
        run: |
          (Invoke-WebRequest -Uri https://install.python-poetry.org -UseBasicParsing).Content | python -
          echo "$env:USERPROFILE\.local\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install dependencies
        run: |
          poetry install
          # Pytest and typer[all] for testing are not in pyproject.toml dev dependencies yet
          pip install pytest "typer[all]"

      - name: Download Tor Expert Bundle (for tests that might need it)
        run: |
         $url = 'https://archive.torproject.org/tor-package-archive/torbrowser/12.5a6/tor-expert-bundle-12.5a6-windows-x86_64.tar.gz'
         $output = 'tor-expert-bundle.tar.gz'
         Invoke-WebRequest -Uri $url -OutFile $output
         tar -xvzf $output -C . 
         Get-ChildItem -Path .
         # Add Tor to PATH - this assumes Tor files are in a 'Tor' subdirectory after extraction
         # Adjust the path if the structure is different
         echo "$PWD\Tor" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      
      - name: Run tests
        run: |
          pytest tests/